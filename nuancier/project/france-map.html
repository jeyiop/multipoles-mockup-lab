<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Implantations — France</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  #m{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  svg{width:100%;height:100%}
</style>
</head>
<body>
<div id="m"></div>
<script>
(async () => {
  const el = document.getElementById('m');
  const q = new URLSearchParams(location.search);
  const COL = {
    fill: '#' + (q.get('fill') || 'F1EDE2'),
    stroke: '#' + (q.get('stroke') || '16171A'),
    mark: '#' + (q.get('mark') || '2442C8'),
    halo: '#' + (q.get('halo') || 'FAF8F3')
  };
  try {
    const topo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')).json();
    const countries = topojson.feature(topo, topo.objects.countries);
    const fr = countries.features.find(f => f.id === '250');
    const metro = {
      type: 'MultiPolygon',
      coordinates: fr.geometry.coordinates.filter(poly => {
        const [lon, lat] = poly[0][0];
        return lon > -8 && lon < 12 && lat > 40 && lat < 52;
      })
    };
    const Wv = 560, Hv = 600;
    const proj = d3.geoConicConformal().parallels([44, 49]).rotate([-3, 0])
      .fitExtent([[26, 26], [Wv - 26, Hv - 26]], metro);
    const path = d3.geoPath(proj);
    const svg = d3.create('svg').attr('viewBox', `0 0 ${Wv} ${Hv}`).attr('preserveAspectRatio', 'xMidYMid meet');
    svg.append('path').attr('d', path(metro))
      .attr('fill', COL.fill).attr('stroke', COL.stroke)
      .attr('stroke-width', 1.4).attr('stroke-linejoin', 'round');
    const sites = [
      { n: '01', lon: 3.06, lat: 50.63, dx: 12, dy: -8 },
      { n: '02', lon: 1.09, lat: 49.44, dx: -34, dy: -6 },
      { n: '03', lon: 2.35, lat: 48.85, dx: 13, dy: 12 },
      { n: '04', lon: -1.55, lat: 47.21, dx: -34, dy: 4 },
      { n: '05', lon: 4.84, lat: 45.76, dx: 13, dy: 4 },
      { n: '06', lon: -0.58, lat: 44.84, dx: -34, dy: 4 }
    ];
    for (const s of sites) {
      const [x, y] = proj([s.lon, s.lat]);
      const g = svg.append('g');
      g.append('line').attr('x1', x - 11).attr('x2', x + 11).attr('y1', y).attr('y2', y)
        .attr('stroke', COL.mark).attr('stroke-width', 1);
      g.append('line').attr('x1', x).attr('x2', x).attr('y1', y - 11).attr('y2', y + 11)
        .attr('stroke', COL.mark).attr('stroke-width', 1);
      g.append('circle').attr('cx', x).attr('cy', y).attr('r', 4.6)
        .attr('fill', 'none').attr('stroke', COL.mark).attr('stroke-width', 1.5);
      g.append('circle').attr('cx', x).attr('cy', y).attr('r', 1.6).attr('fill', COL.mark);
      g.append('text').attr('x', x + s.dx).attr('y', y + s.dy + 4)
        .attr('fill', COL.mark)
        .style('font', "700 13px 'JetBrains Mono', monospace")
        .style('paint-order', 'stroke').style('stroke', COL.halo).style('stroke-width', '4px')
        .text(s.n);
    }
    el.appendChild(svg.node());
  } catch (e) {
    el.innerHTML = "<div style=\"font:500 12px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#55565C\">CARTE EN COURS DE CHARGEMENT…</div>";
  }
})();
</script>
</body>
</html>
