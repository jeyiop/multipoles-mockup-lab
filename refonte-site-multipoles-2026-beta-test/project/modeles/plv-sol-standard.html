<script type="application/json" id="modele-spec">
{
  "ref": "PRE-SOL-PH-4E",
  "famille": "PLV",
  "type": "presentoir de sol 4 etageres + fronton",
  "secteur": "pharmacie",
  "version": "maquette blanche",
  "matiere": "carton double cannelure blanc recto/verso",
  "cannelure": "double",
  "epaisseur_mm": 5,

  "socle_mm": { "l": 400, "p": 300, "h": 140 },
  "fronton_mm": { "l": 520, "h": 490, "decoupe": "arche" },
  "chargement": { "etageres": 4, "inclinaison_deg": 5, "arretoir_mm": 48 },
  "impression": { "couleurs": 0, "faces": "aucune" },
  "convention_pieces": "car_ = carton (surface facturable) | imp_ = zone imprimee | prd_ = produit factice, hors devis"
}
</script>
<three-d-stage name="plv-pharmacie-maquette-blanche" background="#d6d3cb" autorotate></three-d-stage>
<div class="legende">
  <b>Maquette blanche — présentoir de sol 4 étagères + fronton</b>
  <span>corps 40 × 30 cm · fronton 52 cm · H 182 cm · carton blanc 5 mm, sans impression</span>
</div>
<script src="./three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const T = 0.005;          // épaisseur double cannelure
const W = 0.40;           // largeur hors tout du corps
const DZ = 0.15;          // demi-profondeur (avant +Z / arrière -Z)
const SOCLE_H = 0.14;     // hauteur du socle
const TOP_Y = 1.42;       // haut du corps
const SHELVES = [0.14, 0.46, 0.78, 1.10];

const carton = new THREE.MeshStandardMaterial({ name: 'carton_blanc_maquette', color: 0xf1f0ec, roughness: 0.88, metalness: 0 });
const mat = { kraft: carton, tranche: carton, blanc: carton, vert: carton };

const plv = new THREE.Group();
plv.name = 'presentoir_plv_maquette_blanche';

function mesh(name, geo, material, pos, rot) {
  const m = new THREE.Mesh(geo, material);
  m.name = name;
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (rot) m.rotation.set(rot[0] || 0, rot[1] || 0, rot[2] || 0);
  return m;
}
const box = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const extrude = (shape, depth) => new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 40 });

/* ---------- socle ---------- */
plv.add(mesh('car_socle_caisse', box(W, SOCLE_H, 0.30), mat.kraft, [0, SOCLE_H / 2, 0]));

/* ---------- flancs découpés ---------- */
const flanc = new THREE.Shape();
flanc.moveTo(-DZ, 0);
flanc.lineTo(DZ, 0);
flanc.lineTo(DZ, 0.86);
flanc.lineTo(0.105, 1.12);
flanc.lineTo(0.105, 1.22);
flanc.quadraticCurveTo(0.105, 1.28, 0.045, 1.28);
flanc.lineTo(-DZ, 1.28);
flanc.closePath();
const flancGeo = extrude(flanc, T);
plv.add(mesh('car_flanc_droit', flancGeo, mat.kraft, [W / 2, SOCLE_H, 0], [0, -Math.PI / 2, 0]));
plv.add(mesh('car_flanc_gauche', flancGeo, mat.kraft, [-W / 2 + T, SOCLE_H, 0], [0, -Math.PI / 2, 0]));
/* retour replié 15 mm sur chaque tranche verticale */
[['droit', 1], ['gauche', -1]].forEach(([cote, sx]) => {
  plv.add(mesh('car_flanc_' + cote + '_retour_avant', box(0.015, 0.86, T), mat.blanc,
    [sx * (W / 2 - 0.0075), SOCLE_H + 0.43, DZ - T / 2]));
  plv.add(mesh('car_flanc_' + cote + '_retour_arriere', box(0.015, 1.28, T), mat.blanc,
    [sx * (W / 2 - 0.0075), SOCLE_H + 0.64, -DZ + T / 2]));
});

/* ---------- dos + traverse haute ---------- */
plv.add(mesh('car_dos', box(W - 2 * T, TOP_Y - SOCLE_H, T), mat.blanc, [0, (TOP_Y + SOCLE_H) / 2, -DZ + T / 2]));
plv.add(mesh('car_traverse_haute', box(W - 2 * T, T, 0.28), mat.kraft, [0, TOP_Y - T / 2, -0.008]));

/* ---------- 4 étagères inclinées à 5° avec arrêtoir ---------- */
SHELVES.forEach((y, i) => {
  const n = i + 1;
  const g = new THREE.Group();
  g.name = 'car_etagere_' + n;
  g.position.set(0, y, 0);
  g.rotation.x = 0.087;
  g.add(mesh('car_etagere_' + n + '_plateau', box(W - 2 * T, T, 0.26), mat.tranche, [0, T / 2, -0.008]));
  g.add(mesh('car_etagere_' + n + '_arretoir', box(W - 2 * T, 0.048, T), mat.blanc, [0, 0.024 + T, 0.122 + T / 2]));
  plv.add(g);
});

/* ---------- fronton ---------- */
const F_HW = 0.26;
const arche = new THREE.Shape();
arche.moveTo(-F_HW, 0);
arche.lineTo(F_HW, 0);
arche.lineTo(F_HW, 0.26);
arche.quadraticCurveTo(F_HW, 0.375, F_HW - 0.065, 0.41);
arche.quadraticCurveTo(0, 0.49, -(F_HW - 0.065), 0.41);
arche.quadraticCurveTo(-F_HW, 0.375, -F_HW, 0.26);
arche.closePath();

const fronton = new THREE.Group();
fronton.name = 'car_fronton';
fronton.position.set(0, 1.37, 0.02);
fronton.rotation.x = -0.11;
fronton.add(mesh('car_fronton_panneau', extrude(arche, T), mat.blanc));

/* languette de pliage + contreforts, collés au dos du fronton */
fronton.add(mesh('car_fronton_languette', box(0.30, T, 0.14), mat.kraft, [0, 0.055, -0.075]));
const gousset = new THREE.Shape();
gousset.moveTo(0, 0);
gousset.lineTo(0.115, 0);
gousset.lineTo(0, 0.15);
gousset.closePath();
const goussetGeo = extrude(gousset, T);
fronton.add(mesh('car_fronton_contrefort_droit', goussetGeo, mat.kraft, [0.10, 0.058, -0.001], [0, Math.PI / 2, 0]));
fronton.add(mesh('car_fronton_contrefort_gauche', goussetGeo, mat.kraft, [-0.105, 0.058, -0.001], [0, Math.PI / 2, 0]));
plv.add(fronton);

stage.setObject(plv);
</script>
