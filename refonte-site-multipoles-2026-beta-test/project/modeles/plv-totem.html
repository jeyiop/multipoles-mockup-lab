  <b>Maquette blanche — Totem porte-dépliants triangulaire — 3 faces</b>
  <span>triangle équilatéral 35 cm de côté · H 150 cm · 3 faces de communication 35 × 138 cm · 3 poches A5 par face, 9 au total, façade 75 mm · socle triangulaire 12 cm · double cannelure 5 mm, sans impression</span>

<script src="./three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const carton = new THREE.MeshStandardMaterial({ name: 'carton_blanc_maquette', color: 0xf1f0ec, roughness: 0.88, metalness: 0 });
const packMat = new THREE.MeshStandardMaterial({ name: 'pack_blanc_maquette', color: 0xe4e2db, roughness: 0.8, metalness: 0 });
const mat = { kraft: carton, tranche: carton, blanc: carton, vert: carton, pack: packMat };

const plv = new THREE.Group();
plv.name = 'totem_porte_depliants_3_faces_maquette_blanche';

function mesh(name, geo, material, pos, rot) {
  const m = new THREE.Mesh(geo, material);
  m.name = name;
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (rot) m.rotation.set(rot[0] || 0, rot[1] || 0, rot[2] || 0);
  return m;
}
const box = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const extrude = (shape, depth) => new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 40 });
function croixShape(a, b) {
  const c = new THREE.Shape();
  c.moveTo(-a, -b);
  c.lineTo(a, -b); c.lineTo(a, -a); c.lineTo(b, -a);
  c.lineTo(b, a);  c.lineTo(a, a);  c.lineTo(a, b);
  c.lineTo(-a, b); c.lineTo(-a, a); c.lineTo(-b, a);
  c.lineTo(-b, -a); c.lineTo(-a, -a);
  c.closePath();
  return c;
}
function archeShape(hw, yRect, yShoulder, ctrl, inset) {
  const s = new THREE.Shape();
  s.moveTo(-hw, 0);
  s.lineTo(hw, 0);
  s.lineTo(hw, yRect);
  s.quadraticCurveTo(hw, (yRect + yShoulder) / 2, hw - inset, yShoulder);
  s.quadraticCurveTo(0, ctrl, -(hw - inset), yShoulder);
  s.quadraticCurveTo(-hw, (yRect + yShoulder) / 2, -hw, yRect);
  s.closePath();
  return s;
}

const T = 0.005;
const S = 0.35;                       // cote du triangle
const R = S / Math.sqrt(3);           // rayon circonscrit
const r = S / (2 * Math.sqrt(3));     // rayon inscrit
const SOCLE_H = 0.12;
const TOP_Y = 1.50;
const H_P = TOP_Y - SOCLE_H;
const N_POCHE = 3;

/* socle et chapeau triangulaires */
const tri = new THREE.Shape();
for (let k = 0; k < 3; k++) {
  const av = Math.PI / 3 + k * 2 * Math.PI / 3;   // sommets a 60 deg des normales de face
  const u = R * Math.sin(av), v = -R * Math.cos(av);
  if (k === 0) tri.moveTo(u, v); else tri.lineTo(u, v);
}
tri.closePath();
plv.add(mesh('car_socle_triangulaire', extrude(tri, SOCLE_H), mat.kraft, [0, 0, 0], [-Math.PI / 2, 0, 0]));
plv.add(mesh('car_chapeau_triangulaire', extrude(tri, T), mat.kraft, [0, TOP_Y - T, 0], [-Math.PI / 2, 0, 0]));

/* 3 faces : panneau + 3 poches porte-depliants A5 */
for (let k = 0; k < 3; k++) {
  const a = k * 2 * Math.PI / 3;
  const n = k + 1;
  const g = new THREE.Group();
  g.name = 'car_face_' + n;
  g.rotation.y = a;
  g.position.set((r - T / 2) * Math.sin(a), 0, (r - T / 2) * Math.cos(a));
  g.add(mesh('car_face_' + n + '_panneau', box(S, H_P, T), mat.blanc, [0, SOCLE_H + H_P / 2, 0]));
  g.add(mesh('imp_face_' + n + '_bandeau', box(S - 0.010, 0.090, 0.0015), mat.vert, [0, 1.335, T / 2 + 0.0008]));
  g.add(mesh('imp_face_' + n + '_croix', extrude(croixShape(0.020, 0.055), 0.0015), mat.vert, [0, 1.175, T / 2]));
  for (let j = 1; j <= N_POCHE; j++) {
    const y = 0.58 + (j - 1) * 0.235;
    g.add(mesh('car_face_' + n + '_poche_' + j + '_tablette', box(0.172, T, 0.036), mat.kraft, [0, y, 0.018 + T / 2]));
    g.add(mesh('car_face_' + n + '_poche_' + j + '_facade', box(0.172, 0.075, T), mat.blanc, [0, y + 0.0375, 0.036 + T / 2]));
    g.add(mesh('imp_face_' + n + '_poche_' + j + '_filet', box(0.172, 0.014, 0.0012), mat.vert, [0, y + 0.066, 0.036 + T + 0.0006]));
    g.add(mesh('prd_depliant_f' + n + '_p' + j, box(0.148, 0.210, 0.006), mat.pack, [0, y + T + 0.105, 0.016]));
  }
  plv.add(g);
}

stage.setObject(plv);
</script>
