<script type="application/json" id="modele-spec">
{
  "ref": "GLO-CPT-PH-4",
  "famille": "PLV",
  "type": "glorifier de comptoir",
  "secteur": "pharmacie",
  "version": "maquette blanche",
  "matiere": "carton compact blanc recto/verso",
  "cannelure": "simple",
  "epaisseur_mm": 3,
  "hors_tout_mm": { "l": 200, "p": 127, "h": 200 },
  "bac_mm": { "l": 200, "p": 55, "retour": 20 },
  "fronton_mm": { "l": 200, "h": 200, "decoupe": "arche" },
  "chevalet": { "type": "double replie colle au dos", "recul_mm": 70 },
  "chargement": { "facings": 4, "rangs": 1, "capacite": 4,
                  "produit": "pack sirop",
                  "produit_mm": { "l": 44, "p": 44, "h": 110 } },
  "impression": { "couleurs": 0, "faces": "aucune" },
  "convention_pieces": "car_ = carton (surface facturable) | imp_ = zone imprimee | prd_ = produit factice, hors devis"
}
</script>
<three-d-stage name="glorifier-comptoir-pharma-maquette-blanche" background="#d6d3cb" autorotate></three-d-stage>
<div class="legende">
  <b>Maquette blanche — glorifier de comptoir pharma, exposition de produit</b>
  <span>bac 20 × 5,5 cm · retour 20 mm · fronton H 20 cm · 4 facings × 1 rang = 4 packs sirop · chevalet double replié, recul 7 cm · carton blanc 3 mm, sans impression</span>
</div>
<script src="./three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const T = 0.003;        // épaisseur simple cannelure 3 mm
const W = 0.20;         // largeur hors tout du bac
const D = 0.055;        // profondeur hors tout du bac
const REBORD = 0.020;   // hauteur du retour périphérique
const PACK_H = 0.11;    // hauteur pack sirop
const PACK = 0.044;     // section pack (l × p)

const carton = new THREE.MeshStandardMaterial({ name: 'carton_blanc_maquette', color: 0xf1f0ec, roughness: 0.88, metalness: 0 });
const packMat = new THREE.MeshStandardMaterial({ name: 'pack_blanc_maquette', color: 0xe4e2db, roughness: 0.8, metalness: 0 });
const mat = { kraft: carton, tranche: carton, blanc: carton, vert: carton, pack: packMat };

const plv = new THREE.Group();
plv.name = 'glorifier_comptoir_pharma_maquette_blanche';

function mesh(name, geo, material, pos, rot) {
  const m = new THREE.Mesh(geo, material);
  m.name = name;
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (rot) m.rotation.set(rot[0] || 0, rot[1] || 0, rot[2] || 0);
  return m;
}
const box = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const extrude = (shape, depth) => new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 40 });

/* ---------- bac : fond + retour 20 mm ---------- */
plv.add(mesh('car_bac_fond', box(W, T, D), mat.tranche, [0, T / 2, 0]));
plv.add(mesh('car_bac_retour_avant', box(W, REBORD, T), mat.blanc, [0, T + REBORD / 2, D / 2 - T / 2]));
plv.add(mesh('car_bac_retour_droit', box(T, REBORD, D - 2 * T), mat.blanc, [W / 2 - T / 2, T + REBORD / 2, 0]));
plv.add(mesh('car_bac_retour_gauche', box(T, REBORD, D - 2 * T), mat.blanc, [-W / 2 + T / 2, T + REBORD / 2, 0]));
plv.add(mesh('imp_bac_retour_filet', box(W - 0.004, 0.010, 0.0012), mat.vert, [0, T + REBORD / 2, D / 2 + 0.0006]));

/* ---------- chevalet double replié, collé au dos ---------- */
const jambe = new THREE.Shape();
jambe.moveTo(0, 0);
jambe.lineTo(0, 0.17);
jambe.quadraticCurveTo(0.018, 0.035, 0.070, 0.005);
jambe.quadraticCurveTo(0.073, 0, 0.062, 0);
jambe.closePath();
const jambeGeo = extrude(jambe, T);
plv.add(mesh('car_chevalet_jambe_droite', jambeGeo, mat.blanc, [0.055 - T / 2, 0, -D / 2], [0, Math.PI / 2, 0]));
plv.add(mesh('car_chevalet_jambe_gauche', jambeGeo, mat.blanc, [-0.055 - T / 2, 0, -D / 2], [0, Math.PI / 2, 0]));


/* ---------- dos-fronton : une seule pièce, prolongement du dos ---------- */
const F_HW = W / 2;
const arche = new THREE.Shape();
arche.moveTo(-F_HW, 0);
arche.lineTo(F_HW, 0);
arche.lineTo(F_HW, 0.11);
arche.quadraticCurveTo(F_HW, 0.152, F_HW - 0.028, 0.168);
arche.quadraticCurveTo(0, 0.226, -(F_HW - 0.028), 0.168);
arche.quadraticCurveTo(-F_HW, 0.152, -F_HW, 0.11);
arche.closePath();
const archeGeo = extrude(arche, T);

const fronton = new THREE.Group();
fronton.name = 'car_dos_fronton';
fronton.position.set(0, T, -D / 2);
fronton.add(mesh('car_dos_fronton_panneau', archeGeo, mat.blanc, [0, 0, T]));
fronton.add(mesh('car_dos_fronton_doublage', archeGeo, mat.kraft, [0, 0, 0]));
fronton.add(mesh('imp_fronton_bandeau', box(W - 0.004, 0.020, 0.0015), mat.vert, [0, 0.122, 2 * T + 0.0008]));

const a = 0.010, b = 0.026;
const croix = new THREE.Shape();
croix.moveTo(-a, -b);
croix.lineTo(a, -b); croix.lineTo(a, -a); croix.lineTo(b, -a);
croix.lineTo(b, a);  croix.lineTo(a, a);  croix.lineTo(a, b);
croix.lineTo(-a, b); croix.lineTo(-a, a); croix.lineTo(-b, a);
croix.lineTo(-b, -a); croix.lineTo(-a, -a);
croix.closePath();
fronton.add(mesh('imp_fronton_croix', extrude(croix, 0.0015), mat.vert, [0, 0.162, 2 * T]));

/* pattes de collage retour latéral / fronton */
const patte = box(T, REBORD, 0.022);
fronton.add(mesh('car_patte_collage_droite', patte, mat.kraft, [W / 2 - 1.5 * T, REBORD / 2, 2 * T + 0.011]));
fronton.add(mesh('car_patte_collage_gauche', patte, mat.kraft, [-W / 2 + 1.5 * T, REBORD / 2, 2 * T + 0.011]));
plv.add(fronton);

/* ---------- 4 facings × 1 rang = 4 packs sirop ---------- */
const packGeo = box(PACK, PACK_H, PACK);
const etiqGeo = box(0.034, 0.052, 0.0012);
const colW = (W - 2 * T) / 4;

for (let c = 0; c < 4; c++) {
  const x = -W / 2 + T + colW * (c + 0.5);
  const id = 'prd_sirop_c' + (c + 1);
  const g = new THREE.Group();
  g.name = id;
  g.position.set(x, T, 0);
  g.add(mesh(id + '_corps', packGeo, mat.pack, [0, PACK_H / 2, 0]));
  g.add(mesh(id + '_etiquette', etiqGeo, mat.vert, [0, 0.050, PACK / 2 + 0.0006]));
  plv.add(g);
}

stage.setObject(plv);
</script>
